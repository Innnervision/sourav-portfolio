name: Deploy portfolio to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: resume.universeinvedors.tech
  CF_DISTRIBUTION: E2EW1BVK89AJ2M

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: arn:aws:iam::802048283438:role/UniverseInvedorsWebsiteGitHubActions
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Deploy to S3
        run: |
          aws s3 sync out "s3://${{ env.S3_BUCKET }}" \
            --region ${{ env.AWS_REGION }} \
            --delete \
            --cache-control "public,max-age=86400"
          for f in $(find out -name "*.html"); do
            KEY="${f#out/}"
            aws s3 cp "$f" "s3://${{ env.S3_BUCKET }}/$KEY" \
              --region ${{ env.AWS_REGION }} \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache,no-store,must-revalidate" \
              --metadata-directive REPLACE
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_DISTRIBUTION }} \
            --paths "/*"

      - name: Done
        run: |
          echo "### Portfolio Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://resume.universeinvedors.tech" >> "$GITHUB_STEP_SUMMARY"
